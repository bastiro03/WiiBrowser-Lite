name: Wii Build
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
env:
  APP_NAME: "wiibrowser-lite"
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Fix git permissions in container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install extra portlibs
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm \
            devkitPPC \
            libogc \
            ppc-zlib \
            ppc-libpng \
            ppc-freetype \
            ppc-libjpeg-turbo \
            ppc-curl \
            ppc-mxml \
            ppc-libvorbisidec \
            ppc-fribidi \
            ppc-wolfssl \
            ppc-mbedtls \
            ppc-ntfs \
            ppc-ext2fs \
            ppc-libfat \
            zip
      - name: Build project
        run: |
          make -j$(nproc)
      - name: Package Homebrew Channel bundle
        run: |
          mkdir -p package/apps/${{ env.APP_NAME }}
          if [ -f boot.dol ]; then
            cp boot.dol package/apps/${{ env.APP_NAME }}/boot.dol
          elif [ -f *.dol ]; then
            cp *.dol package/apps/${{ env.APP_NAME }}/boot.dol
          else
            echo "Error: No .dol file found! Check your Makefile output."
            exit 1
          fi
          [ -f meta.xml ] && cp meta.xml package/apps/${{ env.APP_NAME }}/
          [ -f icon.png ] && cp icon.png package/apps/${{ env.APP_NAME }}/
          mkdir -p package/debug
          [ -f *.elf ] && cp *.elf package/debug/ || true
          cd package
          zip -r ../${{ env.APP_NAME }}.zip apps/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-build
          path: |
            ${{ env.APP_NAME }}.zip
            package/debug/*.elf
          retention-days: 14
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_NAME }}.zip
            package/apps/${{ env.APP_NAME }}/boot.dol
          generate_release_notes: true

name: Wii Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash -l {0}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-dkp-pkg-v1-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-dkp-pkg-

      - name: Update devkitPro and ensure devkitPPC + libogc
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm devkitPPC libogc

      - name: Install portlibs required by the forwarder channel
        run: |
          set -euo pipefail
          dkp-pacman -S --needed --noconfirm ppc-zlib ppc-ntfs ppc-ext2fs ppc-libfat

      - name: Build Main Application
        run: |
          set -euo pipefail
          make

      - name: Verify Main Application Output
        run: |
          set -euo pipefail
          test -f boot.dol && echo "boot.dol OK ($(stat -c%s boot.dol) bytes)"
          test -f boot.elf && echo "boot.elf OK"

      - name: Build Forwarder Channel
        run: |
          set -euo pipefail
          make -C forwarder

      - name: Verify Forwarder Output
        run: |
          set -euo pipefail
          test -f forwarder/boot.dol && echo "forwarder/boot.dol OK ($(stat -c%s forwarder/boot.dol) bytes)"
          test -f forwarder/boot.elf && echo "forwarder/boot.elf OK"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WiiBrowser-Build-${{ github.sha }}
          path: |
            boot.dol
            boot.elf
            forwarder/boot.dol
            forwarder/boot.elf
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: WiiBrowser-Build-${{ github.sha }}
          path: release

      - name: List release files
        run: |
          ls -la release/

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: WiiBrowser-Lite ${{ github.ref_name }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "🐞 Bug Report"
description: "Report an issue to help the project improve."
title: "[Bug]: "
labels: ["Type: Bug"]
assignees:
  - Bastiro03
body:
  - type: markdown
    attributes:
      value: |
        To expedite issue processing, please search open and closed issues before submitting a new one.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: "I was doing X and instead of Y, Z happened..."
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Is this a regression?
      description: Did this behaviour used to work in the previous version?
      placeholder: "Yes, the last version in which this bug was not present was: ..."
    validations:
      required: false
  - type: textarea
    id: reprodution
    attributes:
      label: To Reproduce
      description: "Steps to reproduce the error. (e.g.: 1. Use x argument / navigate to, 2. Fill this information, 3. Go to..., 4. See error)"
      placeholder: |
        1. Use x argument / navigate to
        2. Fill this information
        3. Go to...
        4. See error
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: A clear and concise description of what you expected to happen.
      placeholder: "I expected that..."
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Media proof
      description: If applicable, add screenshots or videos to help explain your problem.
      placeholder: "Drag and drop screenshots or videos here..."
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Wii System Version / Loader
      placeholder: "e.g. 4.3E, HBC 1.1.4, Dolphin 5.0"
    validations:
      required: false
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      placeholder: "e.g. devkitPPC r42, libogc 2.4.0, ppc-portlibs"
    validations:
      required: false
  - type: input
    id: build_version
    attributes:
      label: Build version
      placeholder: "e.g. boot.dol from CI #123 or v0.1"
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context or additional information about the problem here.
      placeholder: "Any other relevant information..."
    validations:
      required: false
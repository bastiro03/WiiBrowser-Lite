name: Wii Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: ${{ runner.os }}-dkp-pkg-${{ hashFiles('.github/workflows/main.yml') }}
          restore-keys: |
            ${{ runner.os }}-dkp-pkg-

      - name: Update devkitPro and ensure devkitPPC + libogc
        run: |
          set -euo pipefail
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm devkitPPC libogc

      - name: Install portlibs required by the forwarder channel
        run: |
          set -euo pipefail
          # The main application links against the vendored libraries in
          # external/portlibs (headers + static libs, searched first) and
          # libogc, so it needs no portlib packages.  The forwarder channel
          # links -lntfs -lext2fs -lz, which are only available from the
          # devkitPro repo.
          dkp-pacman -S --needed --noconfirm ppc-zlib ppc-ntfs ppc-ext2fs ppc-libfat

      - name: Build Main Application
        run: |
          set -euo pipefail
          make

      - name: Verify Main Application Output
        run: |
          set -euo pipefail
          test -f boot.dol && echo "boot.dol OK ($(stat -c%s boot.dol) bytes)"
          test -f boot.elf && echo "boot.elf OK"

      - name: Build Forwarder Channel
        run: |
          set -euo pipefail
          make -C forwarder

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WiiBrowser-Build-${{ github.sha }}
          path: |
            boot.dol
            boot.elf
            forwarder/boot.dol
            forwarder/boot.elf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: WiiBrowser-Build-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release/
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "WiiBrowser-Lite ${GITHUB_REF_NAME}" \
            --generate-notes
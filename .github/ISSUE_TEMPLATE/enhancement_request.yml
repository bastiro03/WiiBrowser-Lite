name: "🚀➕ Enhancement Request"
description: "Suggest an enhancement for this project. Improve an existing feature."
title: "[Enhancement]: "
labels: ["Type: Enhancement"]
assignees:
  - Bastiro03
body:
  - type: markdown
    attributes:
      value: |
        To expedite issue processing, please search open and closed issues before submitting a new one.
  - type: textarea
    id: problem
    attributes:
      label: Is your enhancement request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: "The existing feature should..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: "I also considered..."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context or additional information about the problem here.
      placeholder: "Any other relevant information..."
    validations:
      required: false